name: Test and deploy Disha career coach

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      force_regression:
        description: Run the prompt regression test even if the prompt didn't change
        type: boolean
        default: false

env:
  PROJECT_ID: project-b2f8fd7f-3661-4447-8b6
  REGION: asia-south1
  SERVICE: career-coach-voice-agent
  SERVICE_URL: https://career-coach-voice-agent-107836625993.asia-south1.run.app
  WORKLOAD_IDENTITY_PROVIDER: projects/107836625993/locations/global/workloadIdentityPools/github-actions/providers/career-coach
  DEPLOY_SERVICE_ACCOUNT: career-coach-deployer@project-b2f8fd7f-3661-4447-8b6.iam.gserviceaccount.com

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      prompt_changed: ${{ steps.changes.outputs.prompt_changed }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: pip
    - run: pip install -r requirements.txt -r requirements-dev.txt
    - name: Unit and integration tests (offline, no secrets)
      run: pytest --ignore=tests/regression
    - name: Did the prompt, tools or agent config change?
      id: changes
      run: |
        base="${{ github.event.before }}"
        if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; fi
        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
          changed=true
        elif git diff --name-only "$base" HEAD | grep -qE '^(agent/prompt\.md|agent/tools\.json|agent_config\.json|agent/quality\.py|tests/regression/)'; then
          changed=true
        else
          changed=false
        fi
        echo "prompt_changed=$changed" >> "$GITHUB_OUTPUT"
        echo "Prompt or tools changed: $changed"

  regression:
    needs: test
    if: needs.test.outputs.prompt_changed == 'true' || inputs.force_regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: pip
    - run: pip install -r requirements.txt
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@v3
    - name: Prompt regression test (simulated calls against the real Gemini Live model)
      run: |
        export GEMINI_API_KEY="$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project=$PROJECT_ID)"
        echo "::add-mask::$GEMINI_API_KEY"
        python tests/regression/run_regression.py | tee regression.txt
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: regression-transcripts
        path: regression.txt

  deploy:
    needs: [test, regression]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.test.result == 'success'
      && (needs.regression.result == 'success' || needs.regression.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@v3
    # Flags, env vars and secrets set on the service are kept between deploys;
    # only the code changes here. See README "Deployment" for the full settings.
    - name: Deploy to Cloud Run from source
      run: gcloud run deploy $SERVICE --source=. --region=$REGION --project=$PROJECT_ID --quiet
    - name: Health check
      run: |
        for i in 1 2 3 4 5; do
          if curl -fsS "$SERVICE_URL/health" | tee health.json; then break; fi
          sleep 10
        done
        python3 -c "import json,sys; h=json.load(open('health.json')); bad=[k for k in ('gemini_key_set','vobiz_set','sessions_bucket_set','otp_set') if not h.get(k)]; sys.exit(f'not configured: {bad}' if bad else 0)"
