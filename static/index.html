<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disha · AI Career Coach</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Disha</h1>
      <p class="tagline">Your AI career coach. Upload your resume and Disha will call you for a 10-minute coaching conversation about it.</p>
    </header>

    <section id="setup" class="card">
      <form id="setup-form">
        <label>Mobile number
          <input id="phone" name="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="98765 43210">
          <span class="hint">Indian mobile numbers only. Disha calls from +91 80654 81243.</span>
        </label>
        <p class="returning">Spoken with Disha before? Just enter your number and click <b>Call me now</b>. Disha remembers your resume and your previous calls. Fill in the rest only to change them.</p>
        <label>Your name
          <input id="name" name="name" maxlength="80" autocomplete="name">
        </label>
        <label>Email for your call summary
          <input id="email" name="email" type="email" maxlength="120" autocomplete="email">
        </label>
        <label>Resume (PDF, DOCX or TXT, up to 5 MB)
          <input id="resume" name="resume" type="file" accept=".pdf,.docx,.txt">
          <span class="hint">Required for your first call. Upload again only to replace it.</span>
        </label>
        <label class="consent">
          <input id="consent" name="consent" type="checkbox" value="yes" required>
          <span>I want Disha to call this number now. I understand Disha is an AI, my resume and calls are processed by Google Gemini, and my resume and call transcripts are kept so Disha can remember them on future calls. A summary is emailed to me.</span>
        </label>
        <button id="start" type="submit">Call me now</button>
        <p id="setup-status" class="status" role="status"></p>
      </form>
    </section>

    <section id="calling" class="card" hidden>
      <div class="talk-head">
        <div id="orb" class="orb" aria-hidden="true"></div>
        <p id="call-status" class="status" role="status" aria-live="polite"></p>
      </div>
      <button id="again" type="button" class="secondary" hidden>Back</button>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
